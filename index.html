<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Two reads on one chart. Technical structure, then buy or sell in plain English." />
  <title>FX Vision</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"><i></i><i></i></span>
        FX Vision
      </div>
      <button class="pair-btn" id="pairBtn" type="button" aria-haspopup="dialog">BTC/USDT</button>
      <div class="tfs" id="tfs" role="tablist" aria-label="Timeframe"></div>
      <button class="icon-btn" id="copyBtn" type="button" title="Copy both lines" aria-label="Copy both lines">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="8" y="8" width="12" height="12" rx="2"/>
          <path d="M4 16V6a2 2 0 0 1 2-2h10"/>
        </svg>
      </button>
      <button class="icon-btn" id="shareBtn" type="button" title="Save results image" aria-label="Save results image">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/>
        </svg>
      </button>
    </header>

    <div class="pricebar">
      <div id="price">—</div>
      <div id="change" class="change"></div>
      <div class="legend" aria-hidden="true">
        <span><i class="ema20"></i>EMA 20</span>
        <span><i class="ema50"></i>EMA 50</span>
        <span><i class="rsi"></i>RSI 14</span>
      </div>
      <div id="status"></div>
    </div>

    <div class="chartwrap">
      <canvas id="chart" aria-label="Price chart with results"></canvas>
      <div id="loading"><div class="spin" role="status" aria-label="Loading"></div></div>
    </div>

    <div id="installBanner" hidden>
      <p><strong>Install FX Vision</strong> — full screen, one tap to the tape.</p>
      <button class="btn ghost" id="dismissInstall" type="button">Not now</button>
      <button class="btn primary" id="installBtn" type="button">Install</button>
    </div>
  </div>

  <div class="backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="pairSheet" role="dialog" aria-hidden="true" aria-label="Choose pair">
    <div class="sheet-head">
      <h2>Pair</h2>
      <input id="pairSearch" type="search" placeholder="Search or type BTC, ETH, SOL…" autocomplete="off" />
    </div>
    <div id="pairList"></div>
  </div>

  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
